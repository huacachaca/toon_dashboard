services:
  toon-energy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TOON_PORT: ${TOON_PORT:-7443}
    container_name: toon-energy
    restart: unless-stopped
    ports:
      - "${TOON_PORT:-7443}:${TOON_PORT:-7443}"
    environment:
      TOON_PORT: ${TOON_PORT:-7443}
      TOON_HOST: ${TOON_HOST:-<<ipaddress>>}
      TOON_DATA_DIR: /app/data
      TOON_ELECTRICITY_COUNTER_DIVISOR: ${TOON_ELECTRICITY_COUNTER_DIVISOR:-1000}
      TOON_GAS_COUNTER_DIVISOR: ${TOON_GAS_COUNTER_DIVISOR:-1000}
      TOON_SOLAR_PANEL_NAME: ${TOON_SOLAR_PANEL_NAME:-JA Solar JAM54D41-455/LB}
      TOON_PANEL_WP: ${TOON_PANEL_WP:-455}
      TOON_SOLAR_PANEL_YEARLY_YIELD_KWH: ${TOON_SOLAR_PANEL_YEARLY_YIELD_KWH:-}
      TOON_SPECIFIC_YIELD_KWH_PER_KWP: ${TOON_SPECIFIC_YIELD_KWH_PER_KWP:-880}
      TOON_PANEL_AREA_M2: ${TOON_PANEL_AREA_M2:-1.998}
      TOON_SOLAR_TARGET_PERCENT: ${TOON_SOLAR_TARGET_PERCENT:-75}
      TOON_CONTRACT_START_MONTH: ${TOON_CONTRACT_START_MONTH:-8}
      TOON_FORECAST_ELECTRICITY_TN_BASE: ${TOON_FORECAST_ELECTRICITY_TN_BASE:-0}
      TOON_FORECAST_ELECTRICITY_TL_BASE: ${TOON_FORECAST_ELECTRICITY_TL_BASE:-0}
      TOON_FORECAST_GAS_BASE: ${TOON_FORECAST_GAS_BASE:-0}
      TOON_FORECAST_BASE_DATE: ${TOON_FORECAST_BASE_DATE:-2026-08-01}
      TOON_TIMEZONE: ${TOON_TIMEZONE:-Europe/Amsterdam}
      TOON_REFRESH_TIMEOUT_SECONDS: ${TOON_REFRESH_TIMEOUT_SECONDS:-30}
    volumes:
      - toon_data:/app/data
      - ${TOON_TLS_CERTFILE:-<<certificate>>}:/app/backend/certificate.pem:ro
      - ${TOON_TLS_KEYFILE:-<<certificate_key>>}:/app/backend/privatekey.pem:ro

volumes:
  toon_data:
    name: toon-energy-data
